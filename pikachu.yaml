# splat configuration — the single source of truth for the ROM layout.
# asm/, build/pikachu.ld, build/undefined_*_auto.txt and assets/ are all
# GENERATED from this file + symbol_addrs.txt + your own ROM:
#
#   uv run splat split pikachu.yaml
#
# Subsegment cut points are measured function boundaries.
name: Hey You, Pikachu! (USA)
sha1: da1a1e47a86720f9d54fb2d2d247480041bda824
options:
  basename: pikachu
  target_path: rom/baserom.us.z64
  base_path: .
  compiler: IDO
  platform: n64
  header_encoding: ASCII
  # rodata strings are not ASCII (the game's font bytes 0xA1.. for accented letters);
  # any non-ASCII byte makes spimdisasm fall back to words, which reassemble exactly.
  string_encoding: ASCII

  asm_path: asm
  src_path: src
  build_path: build
  asset_path: assets
  ld_script_path: build/pikachu.ld
  symbol_addrs_path: symbol_addrs.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt

  find_file_boundaries: False
  migrate_rodata_to_functions: True
  o_as_suffix: True
  use_legacy_include_asm: False
  create_asm_dependencies: False
  ld_bss_is_noload: True
  subalign: 16

segments:
  - name: header
    type: header
    start: 0x0
  - name: ipl3
    type: bin
    start: 0x40
  - name: boot
    type: code
    start: 0x1000
    vram: 0x80000400
    bss_size: 0x57A80
    subalign: 16
