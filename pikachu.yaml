  # Resident overlay: DMA'd by func_800135C0 (called from runtimeMainThreadEntry)
  # with ROM 0xB3C70..0xDCF60 -> 0x8010AAF0; text ..0x80123430, data
  # ..0x80133DE0, bss ..0x80134270 (the loader's arguments, docs/NOTES.md).
  # Unit cuts are object edges where measured: six follow pad words
  # (0xBC0E0, 0xBE1F0, 0xC0390, 0xC26F0, 0xC4ED0, 0xCA940); 0xB7B00 and
  # 0xBF8B0 split the .rodata rhythm (pass-1 strings, then pass-2 constants in
  # function order, once per object). 0xC1CB0 and 0xC5980..0xCA4C0, 0xCC1E0
  # are unverified (no text-referenced rodata), see docs/NOTES.md.
  # .data 0xCC5B0..0xD4EE0, .rodata 0xD4EE0..0xDCF60: the map-name strings at
  # 0x8012BD60 are the string literals of area_terrain_maze's .data area tables.
  - name: ovl
    type: code
    start: 0xB3C70
    vram: 0x8010AAF0
    bss_size: 0x490
    subalign: 16
    subsegments:
      - [0xB3C70, c, ovl/area_terrain_maze]
      - [0xB7B00, c, ovl/player_companion]
      - [0xBC0E0, c, ovl/item_registry]
      - [0xBE1F0, c, ovl/script_vm]
      - [0xBF8B0, c, ovl/actor_script_actions]
